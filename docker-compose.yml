# ArabaIQ — full development stack
services:
  araba-iq-db:
    image: postgres:16-alpine
    volumes:
      - araba_iq_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: araba_iq
      POSTGRES_USER: araba_iq
      POSTGRES_PASSWORD: ${ARABA_IQ_DB_PASSWORD:-changeme}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U araba_iq -d araba_iq"]
      interval: 5s
      timeout: 5s
      retries: 5

  araba-iq-api:
    build:
      context: ./araba-iq-api
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    environment:
      DATABASE_URL: "postgresql://araba_iq:${ARABA_IQ_DB_PASSWORD:-changeme}@araba-iq-db:5432/araba_iq"
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      SEED_DEMO: "${SEED_DEMO:-false}"
    volumes:
      - ./araba-iq-api:/app
    depends_on:
      araba-iq-db:
        condition: service_healthy
    command: ["--reload"]

  araba-iq-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_ARABAIQ_API_URL: "http://localhost:8100/api/v1"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - araba-iq-api

volumes:
  araba_iq_postgres_data:
